<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>REFORM</title>
    <meta name="theme-color" content="#030506" />
    <script>
      // Built assets are relative for Electron; web deep links need the app's base directory.
      if (location.protocol !== 'file:') {
        var base = document.createElement('base');
        base.href = location.pathname === '/app' || location.pathname.indexOf('/app/') === 0 ? '/app/' : '/';
        document.head.appendChild(base);
      }
    </script>
    <script>
      // Apply the saved theme before first paint so there's no flash of the wrong one.
      try {
        var s = JSON.parse(localStorage.getItem('reform:settings') || '{}').state.settings;
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        if (s.accent && s.accent !== 'theme' && s.accent !== 'reform') document.documentElement.dataset.accent = s.accent;
        if (s.uiScale && s.uiScale !== 'default') document.documentElement.dataset.uiScale = s.uiScale;
        if (s.reduceMotion) document.documentElement.dataset.reduceMotion = 'true';
      } catch (e) {}
    </script>
